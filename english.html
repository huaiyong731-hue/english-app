<style>
:root{--c:#ff7a59;--c2:#ffb199;--bg:#fff8f0;--ink:#2d2a32;--mut:#7a7280;--ok:#2fb36d;--bad:#f0a33a;--card:#fff;--line:#f1e4d8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Heiti TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:20px;line-height:1.5}
.page{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom))}
.page.run{padding-bottom:calc(30px + env(safe-area-inset-bottom))}
h1{font-size:30px;margin:8px 0 6px}h2{font-size:24px;margin:10px 0}
.lead{font-size:21px;color:#4a4450;margin:6px 0 14px}.small,small{font-size:16px;color:var(--mut)}small{display:block}
.center{text-align:center}.greet{font-size:34px}
.card{display:block;background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(120,80,40,.08);color:inherit;text-decoration:none}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:14px 16px;margin:10px 0;font-size:21px;font-weight:700;min-height:58px;cursor:pointer;font-family:inherit;color:var(--ink);background:#fff;box-shadow:0 2px 8px rgba(120,80,40,.1)}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5}
.btn.primary{background:var(--c);color:#fff;box-shadow:0 4px 14px rgba(255,122,89,.4)}
.btn.huge{font-size:25px;min-height:74px;border-radius:24px}
.btn.soft{background:#fff}.btn.danger{background:#ffe3e0;color:#b33}
.btn.sound{background:#e8f3ff;color:#1d5fa8}.btn.sound.slow{background:#eef8ec;color:#2e7a32}
.btn.tiny{display:inline-block;width:auto;min-height:44px;font-size:17px;padding:8px 14px;margin:6px 4px}
.row-c{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.row-c .btn{flex:1;min-width:120px}
.sbtns{display:flex;gap:10px}.sbtns .btn{flex:1}
.stats{display:flex;gap:10px;margin:10px 0}.stats div{flex:1;background:#fff;border-radius:18px;padding:10px 4px;text-align:center;box-shadow:0 2px 8px rgba(120,80,40,.08)}
.stats b{display:block;font-size:26px}.stats span{font-size:15px;color:var(--mut)}
.bar{height:14px;background:#f3e6da;border-radius:10px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c),#ffc15e);border-radius:10px;transition:width .4s}
.bar.thin{height:8px}
.next-info{font-size:18px;color:#5b5460;margin-top:-2px}
.tip{background:#fff4d6}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs a{flex:1;text-align:center;padding:8px 0 6px;font-size:14px;color:var(--mut);text-decoration:none}
.tabs a span{display:block;font-size:26px;line-height:1.2}.tabs a.on{color:var(--c);font-weight:700}
.stage{display:flex;gap:14px;align-items:center}.st-icon{font-size:44px}.st-body{flex:1}.st-body b{font-size:21px}
.back{display:inline-block;padding:8px 0;color:var(--c);font-size:19px;text-decoration:none}
.lesson{display:flex;gap:14px;align-items:center;padding:12px 16px}.ln{width:48px;height:48px;border-radius:50%;background:#ffe9e0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none}
.lb{flex:1}.lb b{font-size:20px}.lesson.nextup{outline:3px solid var(--c)}
.tag{display:inline-block;color:var(--c);font-weight:700;font-size:16px}
.runtop{display:flex;gap:12px;align-items:center;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:3}
.runtop .bar{flex:1;margin:0}.x{border:0;background:#fff;border-radius:50%;width:46px;height:46px;font-size:22px;box-shadow:0 2px 6px rgba(0,0,0,.08);color:var(--mut)}
.intro{padding-top:20px}.emoji-big{font-size:96px;line-height:1.1;text-align:center}.emoji-mid{font-size:60px;line-height:1.2}
.bounce{animation:b 1s ease infinite alternate}@keyframes b{to{transform:translateY(-10px) scale(1.05)}}
.steps{display:flex;justify-content:space-around;font-size:18px;font-weight:700}
.rule{background:#fff4d6;text-align:left}
.learn{text-align:center}
.en-big{font-size:56px;font-weight:800;letter-spacing:1px;margin:4px 0;font-family:"Avenir Next",-apple-system,Arial,sans-serif}
.en-sent{font-size:32px;font-weight:800;margin:8px 0;line-height:1.3;font-family:"Avenir Next",-apple-system,Arial,sans-serif}
.en-mid{font-size:34px;font-weight:800}
.hl{color:var(--c);text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px}
.hint{font-size:20px;color:#8a6d3b;background:#fff4d6;display:inline-block;padding:2px 12px;border-radius:12px;margin:4px 0}
.zh{font-size:22px;color:#4a4450}.zh.big{font-size:28px;font-weight:700;margin:6px 0 10px}
.letter-big{font-size:120px;font-weight:800;line-height:1;margin:6px 0;font-family:"Avenir Next",Arial,sans-serif;color:#2d2a32}.letter-big span{color:var(--c);margin-left:24px}
.card.mini{text-align:left;font-size:19px;padding:12px 14px}
.card.ex{display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer}.card.ex>div{flex:1}.play{font-size:30px}
.trace{background:#fff;border-radius:20px;padding:10px;box-shadow:0 2px 10px rgba(120,80,40,.08)}
.trace canvas{width:100%;aspect-ratio:2/1;touch-action:none;border-radius:14px;display:block}
.parts{display:flex;justify-content:center;align-items:center;gap:8px;font-size:34px;font-weight:800;margin:6px 0}
.parts span{background:#ffe9e0;border-radius:12px;padding:0 14px}.parts i{font-style:normal;color:var(--mut)}
.spk{font-size:20px;font-weight:700;color:var(--mut)}
.actions{display:flex;gap:10px;position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));margin-top:14px}.actions .btn{flex:1;margin:0}
.rec{background:#fff;border-radius:18px;padding:12px;margin:10px 0;text-align:center;font-size:21px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.rec.on{background:#ffe9e0;animation:pulse 1s infinite alternate}.rec.ok{background:#e3f7ea}.rec.big{font-size:23px}
@keyframes pulse{to{background:#ffd2c2}}
.q h2{text-align:center}.q>.btn.sound{margin:10px auto}.q-big{font-size:60px;color:var(--c);vertical-align:middle}
.opts{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
.opt{border:3px solid transparent;background:#fff;border-radius:18px;padding:14px;font-size:24px;font-weight:700;min-height:64px;text-align:left;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(120,80,40,.1);color:var(--ink);font-family:inherit}
.opt.big{justify-content:center;font-size:34px}.opt .oe{font-size:36px}
.opt.right{border-color:var(--ok);background:#e3f7ea}.opt.wrong{border-color:var(--bad);background:#fff1dd}
.fb{text-align:center;font-size:24px;font-weight:700;margin:14px 0 4px;padding:10px;border-radius:16px}
.fb.ok{background:#e3f7ea;color:#1c7a47}.fb.soft{background:#fff1dd;color:#9a5a00}
.slots{display:flex;justify-content:center;gap:8px;margin:18px 0}.slots span{width:46px;height:58px;border-bottom:4px solid #d9c9bb;font-size:38px;font-weight:800;text-align:center;line-height:58px}
.slots span.right{color:var(--ok);border-color:var(--ok)}.slots span.wrong{color:#c77700;border-color:var(--bad)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:10px 0}
.tile{min-width:58px;height:58px;border:0;border-radius:14px;background:#fff;font-size:30px;font-weight:800;box-shadow:0 3px 0 #e8d8ca;color:var(--ink);font-family:inherit}
.tile.wtile{font-size:22px;padding:0 14px}.tile.used{opacity:.25}
.built{min-height:70px;background:#fff;border-radius:16px;padding:12px;margin:16px 0;font-size:24px;font-weight:700;text-align:center;border:3px dashed #e8d8ca}
.built span{display:inline-block;margin:2px 3px}.built.right{border:3px solid var(--ok);background:#e3f7ea}.built.wrong{border:3px solid var(--bad)}
.correct{color:var(--ok);margin-top:6px}
.stars{font-size:44px}
.dlg{margin:10px 0}.bubble{max-width:88%;background:#fff;border-radius:20px;padding:10px 14px;margin:10px 0;box-shadow:0 2px 8px rgba(120,80,40,.08);cursor:pointer}
.bubble.b{margin-left:auto;background:#e8f3ff}.bubble.now{outline:3px solid var(--c)}
.who{font-size:15px;color:var(--mut)}.en-line{font-size:23px;font-weight:700}.bubble .zh{font-size:18px}
.explain{font-size:21px;line-height:1.7;background:#fff4d6}
.flash{text-align:center;padding:24px 16px}
.boxes{display:flex;gap:6px;margin:12px 0}.boxes div{flex:1;background:#fff;border-radius:14px;padding:8px 2px;text-align:center;box-shadow:0 2px 8px rgba(120,80,40,.08)}
.boxes b{display:block;font-size:24px}.boxes span{font-size:14px}.boxes small{font-size:12px}
.plan-list{padding-left:24px;margin:8px 0}.plan-list li{margin:4px 0}
.road .day{display:flex;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;margin:8px 0;font-size:17px}
.road .dn{flex:none;width:70px;font-weight:700;color:var(--c)}.road .dl a{color:var(--ink)}.road .day.ok{opacity:.6}.road .day.cur{outline:3px solid var(--c)}
.seg{display:flex;gap:6px;margin:8px 0 14px}.seg button{flex:1;border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 4px;font-size:17px;font-family:inherit;color:var(--ink)}.seg button.on{background:var(--c);color:#fff;border-color:var(--c)}
select{width:100%;font-size:18px;padding:12px;border-radius:14px;border:2px solid var(--line);margin:8px 0;background:#fff;font-family:inherit}
.sw{display:flex;gap:10px;align-items:center;margin:8px 0;font-size:19px}.sw input{width:28px;height:28px;flex:none}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(40,30,30,.9);color:#fff;padding:12px 20px;border-radius:14px;font-size:18px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
/* v2 */
.hint.py{background:#e6f4ff;color:#1d5fa8}
.k{border-radius:8px;padding:0 4px;font-weight:800}
.k-L{background:#ffe1d6;color:#c2410c}.k-x{color:#9aa0a6;text-decoration:line-through;background:#f1f3f4}
.k-p{background:#dbeafe;color:#1d4ed8}.k-r{background:#dcfce7;color:#15803d}.k-s{background:#fde68a;color:#a16207}
.k-S{background:#dbeafe;color:#1d4ed8}.k-V{background:#fee2e2;color:#b91c1c}.k-O{background:#dcfce7;color:#15803d}.k-C{background:#f3e8ff;color:#7e22ce}
.k-T{background:#fef3c7;color:#b45309}.k-P{background:#cffafe;color:#0e7490}.k-Q{background:#fce7f3;color:#be185d}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.legend .k{font-size:15px;padding:3px 8px}
.explain.prin p{margin:8px 0}
.pybox{text-align:left;font-size:18px;background:#eef6ff;border:2px solid #cfe3fb}.pybox>div{margin:4px 0}
.pybox.nocn{background:#fff1f0;border-color:#ffc9c2}.nocn-tag{color:#c0392b;font-weight:800}.pybox .warn{color:#8a4b00}
.pyline{font-size:17px}.nocn-mini{color:#c0392b}
.cmp h3,.errbox h3{font-size:20px;margin:0 0 8px}
.cmp-row{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:18px}.cmp-row .cz{flex:1;background:#fff4d6;border-radius:12px;padding:6px 10px}
.cmp-row .arr{font-weight:800;color:var(--c)}.cmp-row .ce{flex:1.3;background:#e6f4ff;border-radius:12px;padding:6px 10px;font-weight:700;cursor:pointer}
.errbox{background:#fffaf5;border:2px dashed #ffc9a8}.err-row{margin:10px 0;font-size:19px}.err-row .bad{color:#b45309;text-decoration:line-through;text-decoration-color:#e8a87c}
.err-row .good{color:#15803d;font-weight:800;cursor:pointer}
.pat-frame{text-align:center}.slot{display:inline-block;min-width:70px;border-bottom:4px solid var(--c);color:var(--c)}.slot.filled{background:#ffe9e0;border-radius:8px;padding:0 6px}
.fillers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.filler{border:3px solid transparent;background:#fff;border-radius:16px;padding:10px 6px;font-size:20px;font-weight:700;box-shadow:0 2px 8px rgba(120,80,40,.1);font-family:inherit;color:var(--ink)}
.filler span{display:block;font-size:32px}.filler small{font-weight:400}.filler.done{background:#f3fbf5}.filler.on{border-color:var(--c)}
.built.word{font-size:34px;letter-spacing:1px}
.tile.k{box-shadow:0 3px 0 rgba(0,0,0,.12)}.tile.k.used{opacity:.25}
.ckcard{background:linear-gradient(135deg,#fff,#eefaf1);border:2px solid #bfe8cc;cursor:pointer}.ckcard.done{background:#e3f7ea}
.ck-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.ck-top b{font-size:22px;color:#1c7a47}.ck-top span{font-size:16px;color:var(--mut)}
.week{display:flex;gap:6px;margin-top:8px}.week span{flex:1;text-align:center;border-radius:10px;background:#f1ebe4;font-size:15px;padding:4px 0;color:var(--mut)}
.week span.on{background:#2fb36d;color:#fff}.week span.today{outline:2px solid var(--c)}
.ckrow{display:flex;align-items:center;gap:12px;cursor:pointer}.ckrow>div{flex:1}
.ans{width:100%;font-size:28px;padding:14px;border-radius:16px;border:3px solid var(--line);text-align:center;font-family:"Avenir Next",Arial,sans-serif;margin:8px 0}
.ans:focus{outline:none;border-color:var(--c)}
.lesson.locked{opacity:.6;cursor:pointer}
.btn.primary:disabled{opacity:1;background:#ffcfc0;box-shadow:none;color:#fff}
/* v3 老師 */
.tbub{display:flex;gap:10px;align-items:flex-start;margin:10px 0;text-align:left;animation:pop .35s ease}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
.tav{font-size:40px;line-height:1;flex:none;background:#fff;border-radius:50%;width:56px;height:56px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(120,80,40,.12)}
.tb{flex:1;background:#fff;border-radius:4px 20px 20px 20px;padding:12px 14px 8px;box-shadow:0 2px 10px rgba(120,80,40,.1);border:2px solid #ffe0d4}
.tt{font-size:23px;font-weight:700;line-height:1.45;color:#3b2f2a}
.tbtn{display:flex;gap:8px;margin-top:8px}.tbtn button{flex:1;border:0;border-radius:12px;background:#fff1ea;color:#b4532a;font-size:16px;font-weight:700;padding:8px 4px;min-height:42px;font-family:inherit}
.tbub.mini .tt{font-size:19px}.tbub.mini .tav{width:46px;height:46px;font-size:32px}
.tbub.happy .tb{border-color:#bfe8cc;background:#f3fbf5}
.pic-big{font-size:48px;line-height:1.4;margin:10px 0}
.explain.one{font-size:24px;line-height:1.7}
.opt.soft-miss{background:#fff6e8;border-color:#f6d39b;opacity:.7}
/* ---- 拼讀練習 ---- */
.btn.blendbtn{background:linear-gradient(135deg,#5b8def,#7c5ce0);color:#fff;box-shadow:0 4px 14px rgba(91,141,239,.4);text-align:center;text-decoration:none}
.btiles{display:flex;justify-content:center;gap:14px;margin:18px 0 8px;flex-wrap:nowrap;transition:gap .35s}
.btile{width:92px;min-height:118px;border:0;border-radius:22px;font-family:"Avenir Next",Arial,sans-serif;font-size:66px;font-weight:800;line-height:1;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;visibility:hidden;opacity:0;transform:scale(.6);transition:all .35s;box-shadow:0 4px 12px rgba(0,0,0,.12);cursor:pointer}
.btile.show{visibility:visible;opacity:1;transform:scale(1)}
.btile.c0{background:#ff7a59}.btile.c1{background:#2fb36d}.btile.c2{background:#5b8def}.btile.c3{background:#c46be0}
.btile .bz{font-family:inherit;font-size:22px;color:#fff;font-weight:700;min-height:28px;margin-top:4px}
.btile.show:not(.heard){animation:pulse 1.2s infinite}
.btile.lit{transform:scale(1.12);box-shadow:0 0 0 5px #ffd84d,0 6px 16px rgba(0,0,0,.2)}
.btile.tight{margin:0 -9px}
.btiles.quiz .btile{cursor:default;animation:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,122,89,.5)}50%{box-shadow:0 0 0 10px rgba(255,122,89,0)}}
.bmerge{min-height:10px}
.mg-row{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;font-size:30px;font-weight:800;margin:6px 0}
.mg-row i{font-style:normal;color:var(--mut);font-size:24px}
.mg{background:#fff;border-radius:14px;padding:2px 12px;text-align:center;opacity:.45;transition:all .3s;font-family:"Avenir Next",Arial,sans-serif}
.mg small{font-size:18px;color:var(--c);font-family:inherit}
.mg.on{opacity:1;background:#fff3c4;transform:scale(1.08)}
.bmerge.fast .mg-row i:not(:last-of-type){opacity:.15}
.mg-out{font-family:"Avenir Next",Arial,sans-serif;font-size:40px;color:#7c5ce0;opacity:.2;transition:all .4s}
.mg-out.on{opacity:1;transform:scale(1.15)}
.mg-lab{text-align:center;font-size:18px;color:var(--mut)}
.bmeaning .life{font-size:21px;margin-top:6px}
.chant h3{margin:0 0 4px}.ch-rows{display:grid;gap:6px;margin:8px 0}
.ch-row{display:grid;grid-template-columns:62px 1fr auto auto;align-items:center;gap:8px;border:0;border-radius:14px;background:#f7f2ec;padding:8px 10px;text-align:left;font-family:inherit;font-size:19px;color:var(--ink);cursor:pointer}
.ch-row b{font-family:"Avenir Next",Arial,sans-serif;font-size:22px}.ch-row small{font-size:15px}
.ch-row.new{background:#fff1d6}.ch-row.now{background:#ffd84d;transform:scale(1.02)}
.row-c .btn{width:auto;flex:1}
.vids b{display:block;margin-bottom:6px}.vlink{display:block;padding:10px 12px;margin:6px 0;border-radius:14px;background:#eef3ff;color:#2b4fa8;text-decoration:none;font-weight:700;font-size:18px}
.vlink small{font-weight:400}.vnote{margin-top:4px}
.gl{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;margin:6px 0}
.gw{display:inline-flex;flex-direction:column;align-items:center;line-height:1.15;border-radius:10px;padding:2px 4px;transition:background .25s}
.gw b{font-size:24px;font-weight:700}.gw i{font-style:normal;font-size:15px;color:var(--c);margin-top:2px}
.gl.big .gw b{font-size:30px}.gl.big .gw i{font-size:17px}
.gl.sm{justify-content:flex-start}.gl.sm .gw b{font-size:20px}.gl.sm .gw i{font-size:13px}
.gw.now{background:#fff3c4;transform:scale(1.08)}
.glnote{margin:0}
.newtag{font-style:normal;background:var(--c);color:#fff;border-radius:8px;padding:0 6px;font-size:14px;font-weight:700}
</style>
</head>

const synth = window.speechSynthesis;
let voices=[], zhVoices=[], curUtt=null;
const BAD = /Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Ralph|Grandma|Grandpa|Rocko|Shelley|Eddy|Flo|Reed|Sandy/i;
const nl = l => String(l||'').replace(/_/g,'-'); /* Android 有時用 en_US 這種寫法 */
function loadVoices(){ if(!synth) return; const all=synth.getVoices(); voices = all.filter(v => /^en[-_]/i.test(v.lang) || v.lang==='en');
  zhVoices = all.filter(v => /^(zh|cmn)/i.test(v.lang) && !/yue|HK/i.test(v.lang)).sort((a,b)=>zs(b)-zs(a)); }
function zs(v){ let s=0; if(/TW|Hant/i.test(v.lang)) s+=50; else if(/CN|Hans/i.test(v.lang)) s+=30; else if(/HK|yue/i.test(v.lang)) s-=20; if(/Mei-Jia|Meijia|Google|Natural|Enhanced|Premium|HsiaoChen|Yating|Hanhan/i.test(v.name)) s+=15; return s; }
if(synth){ loadVoices(); if('onvoiceschanged' in synth) synth.onvoiceschanged = () => { loadVoices(); if(route().v==='settings') render(); }; }
function scoreVoice(v){ let s=0; if(/en[-_]US/i.test(v.lang)) s+=50; if(v.localService) s+=5; if(/en-us-x-|English United States/i.test(v.name)) s+=25; else if(/en[-_](GB|AU|CA|IE)/i.test(v.lang)) s+=20;
  if(/Samantha|Ava|Allison|Susan|Zoe|Nicky|Joelle|Evan|Nathan|Tom/i.test(v.name)) s+=30; if(/Google US English|Aria|Jenny|Guy|Natural/i.test(v.name)) s+=35;
  if(/Enhanced|Premium|Neural|Natural/i.test(v.name)) s+=15; if(BAD.test(v.name)) s-=100; return s; }
function mainVoice(){ if(!voices.length) loadVoices(); if(P.s.voice){ const v=voices.find(v=>v.voiceURI===P.s.voice); if(v) return v; } return voices.slice().sort((a,b)=>scoreVoice(b)-scoreVoice(a))[0]||null; }
function altVoice(){ const m=mainVoice(); const c=voices.filter(v=>v!==m && !BAD.test(v.name) && /en[-_]US/i.test(v.lang)).sort((a,b)=>scoreVoice(b)-scoreVoice(a)); return c[0]||null; }
function speak(text, o){ o=o||{}; if(!synth){ toast('這台裝置不支援語音 😢'); o.onend&&o.onend(); return; }
  const go = () => { const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; const v=o.voice||mainVoice(); if(v){u.voice=v; u.lang=nl(v.lang);} u.rate=o.rate||P.s.rate; u.pitch=o.pitch||1;
    u.onend = () => { o.onend && o.onend(); }; u.onerror = () => { o.onend && o.onend(); }; curUtt=u; synth.speak(u); };
  if(synth.speaking || synth.pending){ synth.cancel(); setTimeout(go, 80); } else go(); }
function stopSpeak(){ TQ++; if(synth) synth.cancel(); }
/* 老師說話：中文用中文聲音、英文用英文聲音，慢慢說 */
let TQ=0;
function speakT(text, slow, onend){ if(!synth){ onend&&onend(); return; } const my=++TQ; const rate=slow?Math.max(0.5,P.s.trate-0.2):P.s.trate;
  const clean=String(text).replace(/[\u{1F000}-\u{1FFFF}\u2600-\u27BF\uFE0F\u200D→←＋]/gu,' ');
  const segs=clean.split(/([A-Za-z][A-Za-z'’\- ,.?!]*[A-Za-z.?!]|[A-Za-z])/).map(x=>x.trim()).filter(x=>x && /[A-Za-z\u4e00-\u9fff]/.test(x));
  let i=0; const zv=zhVoices[0];
  const next=()=>{ if(my!==TQ) return; if(i>=segs.length){ onend&&onend(); return; } const t=segs[i++]; const en=/^[A-Za-z]/.test(t);
    const u=new SpeechSynthesisUtterance(t); if(en){ const v=mainVoice(); if(v){u.voice=v;} u.lang=v?nl(v.lang):'en-US'; u.rate=Math.min(rate, P.s.rate); } else { if(zv){u.voice=zv; u.lang=nl(zv.lang);} else u.lang='zh-TW'; u.rate=rate; }
    u.onend=()=>setTimeout(next,150); u.onerror=()=>setTimeout(next,50); curUtt=u; synth.speak(u); };
  if(synth.speaking||synth.pending){ synth.cancel(); setTimeout(next,80); } else next(); }
function tbub(text, cls){ return '<div class="tbub '+(cls||'')+'"><div class="tav">👩‍🏫</div><div class="tb"><div class="tt">'+esc(text)+'</div><div class="tbtn"><button data-tsay="'+esc(text)+'">🔁 再講一次</button><button data-tsay="'+esc(text)+'" data-tslow="1">🐢 講慢一點</button></div></div></div>'; }

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){ const m=[]; for(let i=0;i<=a.length;i++){m[i]=[i];} for(let j=1;j<=b.length;j++) m[0][j]=j; for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return m[a.length][b.length]; }
function similar(target, heard){ const t=norm(target), h=norm(heard); if(!t||!h) return 0; const tw=t.split(' ');
  if(tw.length===1) return Math.max(...h.split(' ').concat([h]).map(x => 1-lev(t,x)/Math.max(t.length,x.length)));
  const hw=new Set(h.split(' ')); return tw.filter(w=>hw.has(w)).length/tw.length; }
function repeatAfterMe(it, box){
  const target = it.say;
  if(!SR){ // 沒有語音辨識：先播放，再請使用者自己唸
    box.innerHTML='<div class="rec">👂 先聽…</div>';
    speak(target, {onend: () => { box.innerHTML='<div class="rec big">🗣️ 換你唸唸看！<br><small>大聲唸一次，唸完按「下一個」</small></div>'; }});
    return; }
  stopSpeak();
  let rec; try { rec = new SR(); } catch(e){ box.innerHTML='<div class="rec">🗣️ 大聲跟著唸一次就好 😊</div>'; return; }
  rec.lang='en-US'; rec.interimResults=false; rec.maxAlternatives=3;
  box.innerHTML='<div class="rec on">🎤 請說：<b>'+esc(it.type==='letter'?it.U:it.en)+'</b></div>';
  let got=false;
  rec.onresult = e => { got=true; const alts=[...e.results[0]].map(a=>a.transcript); const best=Math.max(...alts.map(a=>similar(target,a)));
    const heard=alts[0]||''; if(it.type==='letter' || best>=0.6) box.innerHTML='<div class="rec ok">🎉 唸得很好！<br><small>我聽到：'+esc(heard)+'</small></div>';
    else box.innerHTML='<div class="rec">😊 我聽到「'+esc(heard)+'」<br><small>很接近了！再聽一次、再唸一次就更好</small></div>'; };
  rec.onerror = () => { if(!got) box.innerHTML='<div class="rec">🙂 沒聽清楚，沒關係！<br><small>大聲唸一次，然後按「下一個」</small></div>'; got=true; };
  rec.onend = () => { if(!got) box.innerHTML='<div class="rec">🙂 沒聽到聲音，沒關係！<br><small>可以再按一次 🎤，或直接下一個</small></div>'; };
  try{ rec.start(); }catch(e){ box.innerHTML='<div class="rec">🗣️ 大聲跟著唸一次就好 😊</div>'; }
}

let R=null;
function startLesson(L){
  if(!L){ return go('home'); }
  if(locked(L)){ const rq=byId(L.req); page('course', `<div class="center intro"><div class="emoji-big">🔒</div><h1>這一課還沒打開</h1><p class="lead">先完成「${esc(rq.title)}」，這一課就會自動解鎖。<br>一步一步來，學得最穩 😊</p><button class="btn primary huge" onclick="location.hash='#/home'">回首頁</button></div>`); return; }
  stopSpeak(); active=true;
  const steps=[{k:'intro'}];
  if(L.kind==='dlg'){ steps.push({k:'dlg'}); }
  else { if(L.kind==='gram'||L.kind==='prin'){ const T=(L.kind==='gram'?D.teachG:D.teachP)||[]; const t=T[L.n-1];
      if(t){ steps.push({k:'story', t}); steps.push({k:'pic', t}); steps.push({k:'try', t}); }
      const lines = L.kind==='gram' ? L.explain.split('\n') : L.explain; lines.forEach((x,j)=>steps.push({k:'line', x, j, of:lines.length}));
      if(L.kind==='gram'){ if(L.cn.length) steps.push({k:'cn'}); if(L.err.length) steps.push({k:'err'}); } } if(L.kind==='pat') steps.push({k:'patIntro'}); if(L.kind==='phon' && (D.phonWhy||[])[L.n-1]) steps.push({k:'why'}); L.items.forEach(id=>steps.push({k:'learn', id})); if(L.kind==='pat') steps.push({k:'drill'}); if(L.kind==='letter') steps.push({k:'chant'}); }
  steps.push({k:'qintro'});
  buildQuiz(L).forEach(q=>steps.push(q));
  steps.push({k:'done'});
  R={L, steps, i:0, right:0, total:0, requeued:new Set()};
  showStep();
}
function poolFor(L, type){ return Object.values(ITEMS).filter(it => it.type===type && (L.stage<2 ? it.id.startsWith(type==='letter'?'let':'w-') : true)); }
function opts(correct, others, n){ const o=[correct]; shuffle(others).forEach(x=>{ if(o.length<n && !o.some(y=>y.en.toLowerCase()===x.en.toLowerCase()||y.zh===x.zh)) o.push(x); }); return shuffle(o); }
function buildQuiz(L){
  const its=L.items.map(id=>ITEMS[id]); const qs=[];
  if(L.kind==='letter'){
    const pool=poolFor(L,'letter');
    its.forEach(it=>qs.push({k:'q', t:'listenLetter', it, o:opts(it, its.filter(x=>x!==it).concat(pool), 3)}));
    shuffle(its).forEach(it=>qs.push({k:'q', t:'case', it, o:opts(it, its.filter(x=>x!==it).concat(pool), 3)}));
    shuffle(its).forEach(it=>qs.push({k:'q', t:'letterWord', it, o:opts(it, its.filter(x=>x!==it).concat(pool), 3)}));
  } else if(L.kind==='word'||L.kind==='phon'){
    const pool=poolFor(L,'word');
    its.forEach(it=>qs.push({k:'q', t:'listen', it, o:opts(it, its.filter(x=>x!==it).concat(pool), 3)}));
    shuffle(its).forEach(it=>qs.push({k:'q', t:'zh', it, o:opts(it, its.filter(x=>x!==it).concat(pool), 3)}));
    shuffle(its).filter(it=>/^[a-z]{2,6}$/i.test(it.en)).slice(0,3).forEach(it=>qs.push({k:'q', t:'spell', it}));
  } else if(L.kind==='prin'){
    L.drills.forEach(d=>qs.push({k:'q', t:d.b?'build':'orderc', d}));
  } else if(L.kind==='pat'){
    const di=L.drillIds.map(id=>ITEMS[id]);
    shuffle(di).slice(0,3).forEach(it=>qs.push({k:'q', t:'zh', it, o:opts(it, di.filter(x=>x!==it), 3)}));
    shuffle(di).filter(it=>it.en.split(' ').length<=7).slice(0,2).forEach(it=>qs.push({k:'q', t:'order', it}));
  } else if(L.kind==='gram'){
    L.quiz.forEach(q=>qs.push({k:'q', t:'fill', q:q[0], o:q[1].split('|'), a:q[2]}));
    L.err.slice(0,2).forEach(e=>{ const o=shuffle([e[0],e[1]]); qs.push({k:'q', t:'fill', q:'哪一句是對的？', o, a:o.indexOf(e[1]), note:e[2]}); });
    const pool=Object.values(ITEMS).filter(x=>x.type==='sent');
    shuffle(its).slice(0,2).forEach(it=>qs.push({k:'q', t:'meaning', it, o:opts(it, its.filter(x=>x!==it).concat(pool), 3)}));
  } else { // sent / dlg
    const pool=Object.values(ITEMS).filter(x=>x.type===(L.kind==='dlg'?'line':'sent'));
    const sel = L.kind==='dlg' ? shuffle(its).slice(0,4) : its;
    sel.forEach(it=>qs.push({k:'q', t:'meaning', it, o:opts(it, its.filter(x=>x!==it).concat(pool), 3)}));
    shuffle(sel).forEach(it=>{ const w=it.en.split(' '); if(w.length>=2 && w.length<=6) qs.push({k:'q', t:'order', it}); else qs.push({k:'q', t:'zh', it, o:opts(it, its.filter(x=>x!==it).concat(pool), 3)}); });
  }
  return qs;
}

  bg(); let drawing=false;
  const pos=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*600, (e.clientY-r.top)/r.height*300]; };
  cv.addEventListener('pointerdown', e=>{ drawing=true; cv.setPointerCapture(e.pointerId); const [x,y]=pos(e); c.beginPath(); c.moveTo(x,y); });
  cv.addEventListener('pointermove', e=>{ if(!drawing) return; const [x,y]=pos(e); c.lineTo(x,y); c.strokeStyle='#ff6b4a'; c.lineWidth=14; c.lineCap='round'; c.lineJoin='round'; c.stroke(); });

/* ---------- 真實音檔（Web Audio：字母的「聲音」） ---------- */
let AC=null; const BUF={};
function acx(){ if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(C){ try{ AC=new C(); }catch(e){} } } if(AC && AC.state==='suspended'){ try{ AC.resume(); }catch(e){} } return AC; }
function b64buf(b){ const s=atob(b), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u.buffer; }
function loadPh(k){ if(BUF[k]) return BUF[k]; const ac=acx(); if(!ac) return Promise.resolve(null);
  const src = (window.SND_B64 && window.SND_B64[k]) ? Promise.resolve(b64buf(window.SND_B64[k])) : fetch('snd/'+k+'.mp3').then(r=>{ if(!r.ok) throw 0; return r.arrayBuffer(); });
  BUF[k]=src.then(b=>new Promise((res,rej)=>{ const p=ac.decodeAudioData(b,res,rej); if(p&&p.catch) p.catch(rej); })).catch(()=>null); return BUF[k]; }
const PHFB={a:'at',ah:'ah',e:'eh',i:'it',o:'ah',u:'uh',s:'sss',m:'mmm',n:'nnn',l:'lll',f:'fff',v:'vvv',z:'zzz',r:'rrr',h:'ha',w:'wuh',y:'yuh',x:'ks',q:'kw',j:'juh',c:'kuh',k:'kuh',b:'buh',p:'puh',t:'tuh',d:'duh',g:'guh'};
const wait = ms => new Promise(r=>setTimeout(r,ms));
let BT=0; /* 拼讀播放的序號，換畫面就作廢 */
function playPh(k, overlap){ return loadPh(k).then(b=>new Promise(res=>{
  if(!b || !AC){ speak(PHFB[k]||k, {rate:0.7, onend:res}); return; }
  const s=AC.createBufferSource(); s.buffer=b; s.connect(AC.destination); s.start();
  const ms=b.duration*1000*(overlap||1); setTimeout(res, Math.max(120, ms)); })); }
function capP(f, ms){ return new Promise(r=>{ let d=false; const k=()=>{ if(!d){ d=true; r(); } }; setTimeout(k, ms); f(k); }); } /* 語音沒回應時也不會卡住 */
function spP(text, o){ return capP(k=>speak(text, Object.assign({}, o||{}, {onend:k})), 1500+String(text).length*180); }
function sayT(text){ if(!P.s.tauto) return Promise.resolve(); return capP(k=>speakT(text, false, k), 2000+String(text).length*350); }
/* 周育如式：字母、字母、聲音、聲音 */
const ZH = D.zhou||{};
const zc = (l, end) => { const z=ZH[l]||{}; return (end && z.e) ? z.e : (z.c||l); };
function chantLine(l){ const z=ZH[l]||{}, U=l; return z.e ? `${U} ${U} ${z.c} ${z.c}（字前）／${U} ${U} ${z.e} ${z.e}（字後）` : `${U} ${U} ${z.c} ${z.c}`; }
function letterName(l){ const it=ITEMS['let-'+l.toUpperCase()]; return it ? it.say : l.toUpperCase(); }
async function chantOne(l, my){ const nm=letterName(l); for(let i=0;i<2;i++){ if(my!==BT) return; await spP(nm); }
  for(let i=0;i<2;i++){ if(my!==BT) return; await playPh(l); await wait(120); } }
function chantHTML(letters, fresh, title){ fresh=fresh||'';
  return `<div class="card chant"><h3>🎵 ${esc(title||'從頭一起唸')}</h3><p class="small">周育如老師的唸法：<b>字母、字母、聲音、聲音</b>。中文字只是借音，唸的時候不要把中文的母音唸出來。</p>
  <div class="ch-rows">${letters.split('').map(l=>`<button class="ch-row ${fresh.includes(l)?'new':''}" data-ch="${l}"><b>${l.toUpperCase()} ${l}</b><span>${esc(chantLine(l))}</span><small>[${esc((ZH[l]||{}).k||'')}]</small>${fresh.includes(l)?'<em class="newtag">新</em>':''}</button>`).join('')}</div>
  <div class="row-c"><button class="btn primary" data-chall="1">▶ 從頭一起唸</button><button class="btn soft" data-chall="-1">⏪ 倒著唸</button><button class="btn soft" data-chstop="1">⏹ 停</button></div></div>`; }
function bindChant(root){ const rows=[...root.querySelectorAll('.ch-row')];
  const mark=i=>rows.forEach((r,j)=>r.classList.toggle('now', j===i));
  rows.forEach((r,i)=>r.onclick=()=>{ unlock(); acx(); stopSpeak(); const my=++BT; mark(i); chantOne(r.dataset.ch, my).then(()=>{ if(my===BT) mark(-1); }); });
  root.querySelectorAll('[data-chall]').forEach(b=>b.onclick=async()=>{ unlock(); acx(); stopSpeak(); const my=++BT; const ord=rows.map((r,i)=>i); if(b.dataset.chall==='-1') ord.reverse();
    for(const i of ord){ if(my!==BT) return; mark(i); rows[i].scrollIntoView({block:'nearest'}); await chantOne(rows[i].dataset.ch, my); await wait(250); } mark(-1); });
  root.querySelectorAll('[data-chstop]').forEach(b=>b.onclick=()=>{ BT++; stopSpeak(); mark(-1); }); }
/* 影片連結 */
function vidHTML(kind){ const g=(D.vid||{})[kind]; if(!g) return '';
  return g.map(x=>`<div class="card vids"><b>${esc(x.label)}</b>${x.list.map(v=>`<a class="vlink" href="${esc(v.u)}" target="_blank" rel="noopener">▶ ${esc(v.t)}<small>${esc(v.c)}</small></a>`).join('')}<small class="vnote">免費影片，會開新分頁（需要網路）</small></div>`).join(''); }
const STAGE_VID = {'1':'letters','2':'phonics','p':'sentences','4':'sentences'};
/* 逐字中文 */
const GL = (()=>{ const g={}; Object.values(ITEMS).forEach(it=>{ if(it.type==='word' && !it.en.includes(' ')){ const z=String(it.zh).split(/[／/、，,]/)[0].replace(/（.*?）|\(.*?\)/g,'').trim(); if(z && !g[it.en.toLowerCase()]) g[it.en.toLowerCase()]=z; } }); return Object.assign(g, D.gloss||{}); })();
const gtok = t => t.toLowerCase().replace(/[’]/g,"'").replace(/^[^a-z0-9']+|[^a-z0-9'\-]+$/g,'');
function glossHTML(en, cls){ return '<div class="gl '+(cls||'')+'">'+String(en).split(/\s+/).filter(Boolean).map(t=>{ const g=GL[gtok(t)]||''; return '<span class="gw"><b>'+esc(t)+'</b><i>'+esc(g||'·')+'</i></span>'; }).join('')+'</div>'; }

/* ---------- 拼讀練習 ---------- */
const BS = (D.blendSets||[]).map((s,i)=>({i, t:s.t, n:s.n, cv:!!s.cv, L:s.L||'', items:rows(s.w).map(r=>({w:r[0], zh:r[1], emoji:r[2], life:r[3], ex:r[4]||'', gl:r[5]?r[5].split('/'):[], cv:!!s.cv}))}));
function cumLetters(si){ let s=''; for(let i=0;i<=si;i++) s+=BS[i].L||''; return s; }
function phKeys(it){ const ls=it.w.split(''); return it.cv ? [ls[0],'ah'] : ls; }
function tileSound(it, j){ const ls=it.w.split(''); if(it.cv && j===1) return '啊'; return zc(ls[j], j===ls.length-1 && j>0); }
function blendDone(){ P.bl=P.bl||{}; return P.bl; }
function nextSet(){ const d=blendDone(); const f=BS.find(s=>!d[s.i]); return f||null; }
function viewBlend(){ const d=blendDone(), ns=nextSet();
  const b1='英文跟拼音一樣 😊', b2='一個字母一個聲音', b3='連起來就是一個字！';
  page('home', `<a class="back" href="#/home">‹ 回首頁</a><h1>🔤 拼讀練習</h1><p class="lead">看字母怎麼變成字：一個一個點、聽聲音，再連起來。</p>
   ${tbub(b1)}${tbub(b2)}${tbub(b3)}
   <div class="card rule">📌 字母有「名字」，也有「聲音」。<br>拼字的時候，唸的是<b>聲音</b>。<br>例：c 的名字是 see，聲音是「咳」。</div>
   ${ns?`<button class="btn primary huge" id="bgo">▶ ${d[0]?'繼續':'開始'}：${esc(ns.t)}</button>`:'<div class="card center"><div class="emoji-big">🏆</div><b>全部練完了！可以再挑一組複習。</b></div>'}
   ${BS.map(s=>`<a class="card lesson ${ns===s?'nextup':''}" href="#/blend/${s.i}"><div class="ln">${d[s.i]?'✅':(s.i+1)}</div><div class="lb"><b>${esc(s.t)}</b><small>${esc(s.items.map(x=>x.w).join('、'))}</small><small>${esc(s.n)}</small></div></a>`).join('')}
   ${vidHTML('blend')}`);
  autoT([b1,b2,b3]);
  const g=document.getElementById('bgo'); if(g) g.onclick=()=>{ unlock(); acx(); go('blend/'+ns.i); };
}
let B=null;
function startBlend(si){ si=+si; const S=BS[si]; if(!S) return go('blend'); stopSpeak(); BT++; active=true;
  const steps=[{k:'bintro'}]; S.items.forEach((it,j)=>{ steps.push({k:'btiles', it, j}); if(!it.cv) steps.push({k:'bsent', it, j}); });
  steps.push({k:'bqintro'}); shuffle(S.items).forEach(it=>steps.push({k:'bq', it})); steps.push({k:'bdone'});
  B={S, si, steps, i:0}; bStep(); }
function bframe(inner){ const pct=Math.round(B.i/(B.steps.length-1)*100);
  app.innerHTML=`<main class="page run"><div class="runtop"><button class="x" id="quit" aria-label="離開">✕</button><div class="bar"><i style="width:${pct}%"></i></div></div>${inner}</main>`;
  document.getElementById('quit').onclick=()=>{ BT++; stopSpeak(); B=null; go('blend'); }; window.scrollTo(0,0); }
function bNext(){ BT++; stopSpeak(); B.i++; bStep(); }
function bStep(){ const s=B.steps[B.i], S=B.S;
  if(s.k==='bintro'){ const fresh=S.L, cum=cumLetters(B.si);
    const vow=[...new Set(S.items.flatMap(it=>it.cv?[]:it.w.split('').filter(c=>'aeiou'.includes(c))))].filter(v=>!BS.slice(0,B.si).some(p=>!p.cv && p.items.some(x=>x.w.includes(v))));
    const b1 = S.cv ? '這些跟拼音一模一樣 😊' : '先把學過的字母唸一遍 🎵';
    const b2 = S.cv ? '還不是英文單字，是暖身' : '然後一個字一個字拼 🔤';
    bframe(`<div class="center intro"><p class="small">拼讀練習 · 第 ${B.si+1} 組</p><h1>🔤 ${esc(S.t)}</h1>${tbub(b1)}${tbub(b2)}
      ${S.cv?`<div class="card rule">📌 拼音裡 b＋a 唸 ba（爸）。<br>英文也一樣：<b>b 的聲音＋a 的聲音 → ba</b>。</div>`:''}
      ${vow.length?`<div class="card rule">📌 <b>為什麼這樣唸？</b><br>${vow.map(v=>esc(D.vowelWhy[v]||'')).join('<br>')}<br><small>夾在兩個子音中間的母音，唸短短的「聲音」，不是字母的名字。</small></div>`:''}
      </div>
      ${cum?chantHTML(cum, fresh, B.si>2?'從頭複習學過的字母':'今天的字母'):''}
      <div class="card mini">今天 5 個：${S.items.map(x=>'<b>'+esc(x.w)+'</b> '+x.emoji).join('　')}</div>
      <button class="btn primary huge" id="nx">開始拼 ▶</button>`);
    if(cum) bindChant(app); autoT([b1,b2]); document.getElementById('nx').onclick=()=>{ unlock(); acx(); bNext(); };
  }
  else if(s.k==='btiles') bTiles(s.it, s.j);
  else if(s.k==='bsent') bSent(s.it);
  else if(s.k==='bqintro'){ const b1='換你自己讀！👀', b2='看字，選對的圖片';
    bframe(`<div class="center intro"><div class="emoji-big">👀</div><h1>你來讀</h1>${tbub(b1)}${tbub(b2)}${tbub('不會也沒關係，可以按提示 💡')}<button class="btn primary huge" id="nx">來讀 ▶</button></div>`);
    autoT([b1,b2]); document.getElementById('nx').onclick=bNext; }
  else if(s.k==='bq') bQuiz(s.it);
  else if(s.k==='bdone'){ blendDone()[B.si]=true; markStudy(); save(); const nx=BS[B.si+1]; const m=rnd(PRAISE);
    bframe(`<div class="center intro"><div class="emoji-big bounce">🎉</div><h1>這一組完成了！</h1>${tbub(m,'happy')}<div class="card mini">你自己拼出了：${B.S.items.map(x=>'<b>'+esc(x.w)+'</b> '+x.emoji).join('　')}</div>
      ${nx?`<button class="btn primary huge" id="nxs">▶ 下一組：${esc(nx.t)}</button>`:''}<button class="btn soft" id="bl">📋 回拼讀練習</button><button class="btn soft" id="hm">🏠 回首頁</button></div>`);
    speakT(m.replace(/[!！]/g,'')); if(nx) document.getElementById('nxs').onclick=()=>go('blend/'+nx.i);
    document.getElementById('bl').onclick=()=>go('blend'); document.getElementById('hm').onclick=()=>go('home'); }
}
/* 一個字：字母方塊一個一個出現 → 點一下聽聲音 → 兩個連起來 → 再加一個 → 整個字 */
function bTiles(it, j){ const ls=it.w.split(''), keys=phKeys(it), n=ls.length;
  bframe(`<p class="small center">第 ${j+1} / ${B.S.items.length} 個字 · 一步一步拼</p>
   <div id="tbw">${tbub('點第一個字母，聽它的聲音 👆')}</div>
   <div class="btiles" id="bt">${ls.map((l,k)=>`<button class="btile c${k%4} ${k===0?'show':''}" data-k="${k}"><b>${esc(l)}</b><small class="bz"></small></button>`).join('')}</div>
   <div class="bmerge" id="bm"></div>
   <div id="bmean"></div>
   <div class="actions" id="bact"></div>`);
  const tiles=[...app.querySelectorAll('.btile')], tbw=document.getElementById('tbw'), act=document.getElementById('bact'), bm=document.getElementById('bm');
  let say=t=>{ tbw.innerHTML=tbub(t); return sayT(t); };
  let tapped=0, busy=false;
  const lit=(a,b,cls)=>tiles.forEach((t,k)=>{ t.classList.toggle('lit', k>=a && k<=b); t.classList.toggle('tight', !!cls && k>=a && k<=b); });
  async function merge(upto){ const my=++BT; busy=true; act.innerHTML=''; const part=ls.slice(0,upto+1).join(''), snd=ls.slice(0,upto+1).map((l,k)=>k===1&&it.cv?'啊':tileSound(it,k));
    const last=upto===n-1;
    const line = upto===1 ? `${snd[0]}＋${snd[1]}，連快一點 → ${part}` : `再加 ${ls[upto]}「${snd[upto]}」→ ${part}`;
    say(line);
    bm.innerHTML=`<div class="mg-row">${snd.map((x,k)=>`<span class="mg" data-m="${k}">${esc(ls[k])}<small>${esc(x)}</small></span>`).join('<i>＋</i>')}<i>→</i><span class="mg-out">${esc(part)}</span></div><div class="mg-lab" id="ml">🐢 慢慢唸</div>`;
    const mgs=[...bm.querySelectorAll('.mg')], out=bm.querySelector('.mg-out'), ml=document.getElementById('ml');
    await wait(700);
    /* 慢：一個一個亮起來 */
    for(let k=0;k<=upto;k++){ if(my!==BT) return; lit(0,k); mgs.forEach((m,q)=>m.classList.toggle('on', q<=k)); await playPh(keys[k]); await wait(450); }
    if(my!==BT) return; ml.textContent='🐇 快一點'; lit(0,upto,1); bm.classList.add('fast'); await wait(300);
    /* 快：聲音黏在一起 */
    for(let k=0;k<=upto;k++){ if(my!==BT) return; await playPh(keys[k], 0.72); }
    if(my!==BT) return; await wait(250); out.classList.add('on');
    if(last){ ml.textContent='🗣️ 整個字'; await spP(it.w, {rate:0.7}); if(my!==BT) return; await wait(200); await spP(it.w); }
    else { ml.textContent='👍 '+part+' 連好了'; }
    busy=false; if(my!==BT) return;
    if(last) showMeaning(); else { tiles[upto+1].classList.add('show'); say('再點下一個字母 👆'); act.innerHTML=`<button class="btn soft" id="again">🔁 再連一次</button>`; document.getElementById('again').onclick=()=>merge(upto); }
  }
  function showMeaning(){ const b1 = it.cv ? `${it.w} 就像拼音，是暖身` : `${it.w} 就是「${it.zh}」${it.emoji}`, b2 = it.cv ? `就像${it.life}` : `就像「${it.life}」`;
    document.getElementById('bmean').innerHTML=`<div class="card bmeaning center"><div class="emoji-big">${it.emoji}</div><div class="en-big">${esc(it.w)}</div><div class="zh big">${esc(it.zh)}</div><div class="life">👉 ${esc(it.life)}</div></div>${tbub(b1)}${tbub(b2)}`;
    act.innerHTML=`<button class="btn soft" id="again">🔁 再連一次</button><button class="btn primary" id="nx">${it.cv?'下一個 ▶':'用在句子裡 ▶'}</button>`;
    document.getElementById('again').onclick=()=>merge(n-1); document.getElementById('nx').onclick=bNext;
    autoT([b1,b2]); window.scrollTo(0, document.body.scrollHeight); }
  tiles.forEach((t,k)=>t.onclick=async()=>{ if(busy || !t.classList.contains('show')) return; unlock(); acx();
    const l=ls[k], z=tileSound(it,k), first=(k===tapped);
    t.querySelector('.bz').textContent=z; t.classList.add('heard'); lit(k,k); const my=++BT; stopSpeak();
    await playPh(keys[k]); if(my!==BT) return;
    let line = (it.cv && k===1) ? 'a 在這裡唸「啊」，像拼音 a' : `${l} 的聲音是「${z}」`;
    if(!it.cv && k===n-1 && ZH[l] && ZH[l].e) line = `${l} 在字後面，唸「${z}」`;
    await say(line); if(my!==BT) return; await playPh(keys[k]);
    if(first){ tapped++;
      if(k===0){ tiles[1].classList.add('show'); say('再點下一個字母 👆'); }
      else { act.innerHTML=`<button class="btn primary huge" id="mg">🔗 ${k===1?'連起來':'再連起來'}</button>`; document.getElementById('mg').onclick=()=>merge(k); } }
  });
  autoT(['點第一個字母，聽它的聲音']);
}
/* 例句：每個英文字下面都有中文，老師一個字一個字講為什麼 */
function bSent(it){ const ws=it.ex.split(' '), whyOf=(w,k)=>{ const t=gtok(w); if(t===it.w) return `${it.w} ＝ ${it.zh} ${it.emoji}`; return (D.why||{})[t] || `${w.replace(/[.!?]/g,'')} ＝ ${it.gl[k]}`; };
  const full=it.gl.join(''); let k=-1;
  bframe(`<p class="small center">用在句子裡</p>${tbub('一個字一個字看 👀')}
    <div class="card bsent center"><div class="gl big">${ws.map((w,q)=>`<span class="gw" data-q="${q}"><b>${esc(w)}</b><i>${esc(it.gl[q]||'')}</i></span>`).join('')}</div>
    <div class="zh big">${esc(full)}</div>${speakBtns(it.ex)}</div>
    <div id="why"></div><div class="actions"><button class="btn primary" id="nx">老師講第一個字 ▶</button></div>`);
  const gws=[...app.querySelectorAll('.gw')], nx=document.getElementById('nx'), wy=document.getElementById('why');
  speak(it.ex, {rate:0.7});
  nx.onclick=()=>{ k++; if(k<ws.length){ gws.forEach((g,q)=>g.classList.toggle('now', q===k)); const t=whyOf(ws[k],k); wy.innerHTML=tbub(t); speakT(t); nx.textContent = k<ws.length-1 ? '下一個字 ▶' : '整句連起來 ▶'; }
    else if(k===ws.length){ gws.forEach(g=>g.classList.remove('now')); const t='意思是：'+full; wy.innerHTML=tbub(t,'happy'); speakT(t); speak(it.ex,{rate:0.7}); nx.textContent='我懂了，下一個 ▶'; }
    else bNext(); };
}
/* 你來讀：只看字，選圖 */
function bQuiz(it){ const others=shuffle(B.S.items.filter(x=>x!==it)).slice(0,2), o=shuffle([it].concat(others)); let miss=0;
  const lab=x=>x.cv?((x.life.match(/「(.)」/)||[])[1]||x.zh):x.zh;
  bframe(`<p class="small center">你來讀 👀</p>${tbub('這個字怎麼唸？是哪個意思？')}
   <div class="btiles quiz">${it.w.split('').map((l,k)=>`<span class="btile show c${k%4}"><b>${esc(l)}</b></span>`).join('')}</div>
   <div class="row-c"><button class="btn soft" id="hint">💡 提示：一個一個聲音</button></div>
   <div class="opts">${o.map((x,q)=>`<button class="opt" data-q="${q}"><span class="oe">${x.emoji}</span>${esc(lab(x))}</button>`).join('')}</div><div id="fb"></div>`);
  document.getElementById('hint').onclick=async()=>{ unlock(); acx(); const my=++BT; const ts=[...app.querySelectorAll('.btile')]; const ks=phKeys(it);
    for(let q=0;q<ks.length;q++){ if(my!==BT) return; ts.forEach((t,r)=>t.classList.toggle('lit', r===q)); await playPh(ks[q]); await wait(400); } ts.forEach(t=>t.classList.remove('lit')); };
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ const x=o[+b.dataset.q], fb=document.getElementById('fb');
    if(x===it){ app.querySelectorAll('.opt').forEach(y=>y.disabled=true); b.classList.add('right'); const m=rnd(D.cheers); fb.innerHTML=tbub(m,'happy')+`<div class="card mini center"><b>${esc(it.w)}</b> ＝ ${esc(it.zh)} ${it.emoji}</div><button class="btn primary" id="cont">繼續 ▶</button>`;
      spP(it.w,{rate:0.75}).then(()=>speakT(m.replace(/[!！]/g,''))); document.getElementById('cont').onclick=bNext; }
    else { miss++; b.classList.add('soft-miss'); b.disabled=true; fb.innerHTML=tbub(miss>1?'按 💡 提示，一個一個聽':'差一點點，我們再看一次 😊'); speakT(miss>1?'按提示，一個一個聽':'差一點點，我們再看一次'); } });
}

/* ---------- 啟動 ---------- */
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); window.__BIP=e; if(route().v==='settings') render(); });
window.__APP = {LESSONS, ITEMS, STAGES};
render();
if('serviceWorker' in navigator && /^https?:/.test(location.protocol) && !window.INLINE_BUILD){ window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  const had=!!navigator.serviceWorker.controller; let reloaded=false; navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(had && !reloaded){ reloaded=true; location.reload(); } }); }
})();
</script>
